<!-- Cookie Consent Banner -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.umd.css">
<script src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.umd.js"></script>

<script>
  window.CookieConsent.run({
    mode: 'opt-in',
    autoShow: true,
    manageScriptTags: true,
    autoClearCookies: true,
    revision: 1,
    categories: {
      necessary: {
        enabled: true,
        readOnly: true
      },
      analytics: {
        autoClear: {
          cookies: [
            { name: /^(_ga)/ },
            { name: '_gid' },
            { name: '_gat' },
            { name: /^_gat_/ },
            { name: /^_gcl_/ },
            { name: /^(_pk_id|_pk_ses|_pk_ref)/ },
            { name: /^(_hj)/ },
            { name: /^_cfuvid$/ }
          ],
          reloadPage: true
        }
      }
    },
    onFirstConsent: () => {
      console.log('Consent given on first visit');
    },
    onConsent: () => {
      console.log('Consent updated');
    },
    onChange: ({cookie}) => {
      console.log('Consent changed:', cookie.categories);
    },
    cookies: {
      name: 'cc_cookie'
    },
    language: {
      default: 'en',
      autoDetect: 'document',
      translations: {
        en: {
          consentModal: {
            title: 'We use cookies',
            description: 'We only use necessary cookies and optional analytics cookies. Analytics scripts are loaded only after you consent.',
            acceptAllBtn: 'Accept all',
            acceptNecessaryBtn: 'Reject optional',
            showPreferencesBtn: 'Manage settings',
            closeIconLabel: 'Close',
            footer: '<a href="/impressum/" target="_self" rel="nofollow">Impressum</a> | <a href="/impressum-en/" target="_self" rel="nofollow">Site Notice</a> | <a href="/privacy-policy/" target="_self" rel="nofollow">Datenschutzerklärung</a> | <a href="/privacy-policy-en/" target="_self" rel="nofollow">Privacy Policy</a>'
          },
          preferencesModal: {
            title: 'Cookie preferences',
            acceptAllBtn: 'Accept all',
            acceptNecessaryBtn: 'Reject optional',
            savePreferencesBtn: 'Save current selection',
            closeIconLabel: 'Close',
            sections: [
              {
                title: 'Necessary cookies',
                description: 'Required for the site to function.',
                linkedCategory: 'necessary'
              },
              {
                title: 'Analytics cookies',
                description: 'Used to measure traffic and improve the site.',
                linkedCategory: 'analytics'
              }
            ]
          }
        },
        de: {
          consentModal: {
            title: 'Wir verwenden Cookies',
            description: 'Wir verwenden nur notwendige Cookies und optionale Analytics-Cookies. Analytics-Skripte werden erst nach Ihrer Zustimmung geladen.',
            acceptAllBtn: 'Alle akzeptieren',
            acceptNecessaryBtn: 'Optionale ablehnen',
            showPreferencesBtn: 'Einstellungen verwalten',
            closeIconLabel: 'Schließen',
            footer: '<a href="/impressum/" target="_self" rel="nofollow">Impressum</a> | <a href="/impressum-en/" target="_self" rel="nofollow">Site Notice</a> | <a href="/privacy-policy/" target="_self" rel="nofollow">Datenschutzerklärung</a> | <a href="/privacy-policy-en/" target="_self" rel="nofollow">Privacy Policy</a>'
          },
          preferencesModal: {
            title: 'Cookie-Einstellungen',
            acceptAllBtn: 'Alle akzeptieren',
            acceptNecessaryBtn: 'Optionale ablehnen',
            savePreferencesBtn: 'Auswahl speichern',
            closeIconLabel: 'Schließen',
            sections: [
              {
                title: 'Notwendige Cookies',
                description: 'Diese Cookies sind für die Funktion der Website erforderlich.',
                linkedCategory: 'necessary'
              },
              {
                title: 'Analytics-Cookies',
                description: 'Sie helfen dabei, Besucherzahlen zu messen und die Website zu verbessern.',
                linkedCategory: 'analytics'
              }
            ]
          }
        }
      }
    },
    guiOptions: {
      consentModal: {
        layout: 'cloud inline',
        position: 'bottom center'
      },
      preferencesModal: {
        layout: 'box',
        equalWeightButtons: true
      }
    }
  });
</script>
